name: PR policy

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        ready_for_review,
        labeled,
        unlabeled,
      ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: Policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Validate PR naming, description and scope
        run: node scripts/quality/validate-pr-policy.mjs --event "$GITHUB_EVENT_PATH"
      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-policy-${{ github.event.pull_request.number }}
          path: quality/reports/pr-policy.json
          if-no-files-found: error
          retention-days: 30
