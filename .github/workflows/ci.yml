name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  NODE_VERSION: 22.23.1

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static gates
        run: pnpm ci:static
      - name: Upload ratchet reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-ratchet-reports
          path: quality/reports
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 30

  security-boundaries:
    name: Security and product boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:security

  mobile-exports:
    name: Reproducible mobile exports
    needs: [static-quality, tests, security-boundaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:mobile-exports
      - name: Create traceability manifest
        run: >-
          pnpm release:manifest --require-clean --output dist/ci-manifests/mobile.json
          dist/m5-export-ios dist/m5-export-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-js-exports
          path: |
            dist/m5-export-ios
            dist/m5-export-android
            dist/ci-manifests/mobile.json
          if-no-files-found: error
          retention-days: 14

  web-exports:
    name: Consumer, QA, and PWA exports
    needs: [static-quality, tests, security-boundaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:web-exports
      - run: >-
          pnpm release:manifest --require-clean --output dist/ci-manifests/web.json
          dist/m5-web-consumer dist/m5-web-qa dist/m5-pwa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-exports
          path: |
            dist/m5-web-consumer
            dist/m5-web-qa
            dist/m5-pwa
            dist/ci-manifests/web.json
          if-no-files-found: error
          retention-days: 14

  required-gate:
    name: Required gate
    if: always()
    needs:
      [static-quality, tests, security-boundaries, mobile-exports, web-exports]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every required result
        run: |
          test "${{ needs.static-quality.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.security-boundaries.result }}" = success
          test "${{ needs.mobile-exports.result }}" = success
          test "${{ needs.web-exports.result }}" = success
