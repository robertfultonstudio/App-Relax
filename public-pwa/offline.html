<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f3e9d8" />
    <title>App Relax · Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        background: #f3e9d8;
        color: #17211f;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, #d7d5ed 0, transparent 36%),
          radial-gradient(circle at 80% 72%, #d5e5dd 0, transparent 40%),
          #f3e9d8;
      }
      main {
        width: min(32rem, calc(100% - 3rem));
        border-top: 1px solid rgba(23, 33, 31, 0.45);
        padding-top: 2rem;
      }
      p:first-child {
        font-size: 0.75rem;
        letter-spacing: 0.16em;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(2.5rem, 10vw, 4.5rem);
        font-weight: 400;
        line-height: 0.95;
        margin: 1rem 0;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p>APP RELAX</p>
      <h1>A quiet pause.</h1>
      <p>
        This page is not saved on your device yet. Reconnect once to finish
        preparing the app. Sounds you explicitly download remain available on
        this device; other sounds need a connection.
      </p>
    </main>
  </body>
</html>
